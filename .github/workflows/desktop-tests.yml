name: Desktop compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            13f_dashboard
            13f_pipeline
            tools
            tests
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r 13f_dashboard/requirements.txt
      - run: python -m unittest discover -s tests -v
